# Clustead 리버스 프록시 — 실제 운영 설정 (호스트 nginx)
#
# 같은 디렉터리의 clustead.conf / clustead-ssl.conf 와 용도가 다르다. 저 둘은
# nginx 를 컨테이너로 띄우는 full-stack 모드용(`upstream app:8000`)이고, 운영
# 서버는 **호스트 nginx 가 127.0.0.1:8000 의 앱 컨테이너로 프록시**하는 구조다
# (docker-compose.app-only.yml). nginx 가 호스트에 있어야 컨테이너가 죽어도
# 안내 페이지를 서빙할 수 있다 — docs/MONITORING.md 4-C 참고.
#
# 서버 위치: /etc/nginx/sites-available/clustead
# 이 파일은 그 사본이다. 서버에서 설정을 고쳤다면 이쪽도 같이 갱신할 것.
# 반대로 이 파일을 서버에 그냥 복사하면 안 된다 — `# managed by Certbot` 줄들은
# certbot 이 인증서 경로에 맞춰 직접 쓴 것이라 서버 상태가 원본이다.
#
# 반영 절차: 편집 → `nginx -t` 통과 → `systemctl reload nginx`
#   (백업은 /etc/nginx/sites-available/clustead.bak.<날짜> 로 남긴다)

server {
    server_name clustead.com www.clustead.com;
    client_max_body_size 10m;

    # Claude-SearchBot 차단 (2026-08-06 추가)
    #
    # 이 봇이 하루 1,787요청(전체 트래픽의 53%)을 분당 40~50회로 쏟아부으며
    # /apartments 상세만 연속으로 훑었다. robots.txt 의 Crawl-delay: 10(=6회/분)을
    # 7~8배 무시한다. 상세 렌더가 5~42초 걸리는데 워커가 2개뿐이라 워커가 통째로
    # 막혀 healthz 가 10초 타임아웃 → 그날 알람 3건이 전부 이것 때문이었다.
    #
    # ⚠️ 이건 레이트리밋이 아니라 전면 차단이라 AI 검색 색인을 포기하는 대가를
    # 치른다. 응급조치이며, limit_req 존(6r/m)으로 완화하는 게 원래 방향이다.
    # Googlebot·일반 사용자는 영향받지 않는다(UA 매칭이 이 봇 한정).
    location ^~ /apartments/ {
        if ($http_user_agent ~* "Claude-SearchBot") {
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;

        # 앱 컨테이너가 죽어 있거나(재배포·재시작) 응답이 없을 때, Cloudflare 기본
        # 영문 오류 화면 대신 우리 안내 페이지를 보여준다. nginx 는 호스트에서
        # 돌기 때문에 컨테이너가 내려가도 이 경로는 살아 있다.
        #
        # =503 으로 상태코드를 통일한다. 503(Service Unavailable)은 '일시적'이라는
        # 뜻이라 검색엔진이 색인을 지우지 않고 나중에 다시 크롤한다.
        # proxy_intercept_errors 는 켜지 않는다 — 앱이 스스로 낸 5xx(코드 버그)까지
        # 가리면 장애를 못 보게 된다. 여기서 잡는 건 nginx 가 판단한
        # '업스트림 없음/타임아웃'뿐이다.
        error_page 502 503 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/clustead;
        internal;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/clustead.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clustead.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.clustead.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = clustead.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name clustead.com www.clustead.com;
    return 404; # managed by Certbot
}
