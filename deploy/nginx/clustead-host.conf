# Clustead 리버스 프록시 — 실제 운영 설정 (호스트 nginx)
#
# 같은 디렉터리의 clustead.conf / clustead-ssl.conf 와 용도가 다르다. 저 둘은
# nginx 를 컨테이너로 띄우는 full-stack 모드용(`upstream app:8000`)이고, 운영
# 서버는 **호스트 nginx 가 127.0.0.1:8000 의 앱 컨테이너로 프록시**하는 구조다
# (docker-compose.app-only.yml). nginx 가 호스트에 있어야 컨테이너가 죽어도
# 안내 페이지를 서빙할 수 있다 — docs/MONITORING.md 4-C 참고.
#
# 서버 위치: /etc/nginx/sites-available/clustead
# 이 파일은 그 사본이다. 서버에서 설정을 고쳤다면 이쪽도 같이 갱신할 것.
# 반대로 이 파일을 서버에 그냥 복사하면 안 된다 — `# managed by Certbot` 줄들은
# certbot 이 인증서 경로에 맞춰 직접 쓴 것이라 서버 상태가 원본이다.
#
# 반영 절차: 편집 → `nginx -t` 통과 → `systemctl reload nginx`
#   (백업은 /root/clustead-config-backups/nginx-clustead.bak.<날짜> 로 남긴다)

# Claude-SearchBot 속도 제한 (2026-08-06)
#
# map 과 limit_req_zone 은 http 컨텍스트 전용 directive 라 server 블록 안에 둘 수
# 없다. 이 파일은 nginx.conf 의 `include /etc/nginx/sites-enabled/*` 를 통해
# http 안에서 읽히므로, 파일 최상단(= http 컨텍스트)이 유효한 자리다.
#
# 키가 빈 문자열이면 nginx 는 그 요청을 아예 집계하지 않는다. 그래서 봇이 아닌
# 요청은 default "" 로 떨어져 제한을 전혀 받지 않는다 — 일반 사용자·Googlebot
# 무영향이 이 한 줄로 보장된다.
map $http_user_agent $claude_searchbot {
    default              "";
    "~*Claude-SearchBot" "claudebot";
}

# 6r/m = 10초에 1회. robots.txt 의 Crawl-delay: 10 과 같은 값이다.
limit_req_zone $claude_searchbot zone=claudebot:1m rate=6r/m;

# 아래 두 map 은 429(속도제한) 응답에만 헤더를 붙이기 위한 것이다.
#
# add_header 는 값이 빈 문자열이면 헤더를 아예 추가하지 않는다. 그래서 $status 로
# 분기해두면 200 응답에는 헤더가 붙지 않는다. 예전처럼 `always` 로 무조건 붙이면
# no-store 가 정상 응답까지 따라가 Cloudflare 가 /apartments 를 통째로 BYPASS 했다
# (앱이 보내는 s-maxage=86400 이 무력화 → 봇 크롤이 전부 origin 직격).
map $status $clustead_ratelimit_retry_after {
    default "";
    429     "10";
}

map $status $clustead_ratelimit_cache_control {
    default "";
    429     "no-store";
}

server {
    server_name clustead.com www.clustead.com;
    client_max_body_size 10m;

    # Claude-SearchBot 속도 제한 (2026-08-06 전면차단 → 완화)
    #
    # 경위: 이 봇이 하루 1,787요청(전체의 53%)을 분당 40~50회로 /apartments 상세만
    # 훑었다. 상세 렌더가 5~42초인데 워커가 2개뿐이라 워커가 통째로 막혀 healthz 가
    # 10초 타임아웃 → 그날 알람 3건. robots.txt 의 Crawl-delay: 10 은 무시했다.
    #
    # 처음엔 이 경로에서 해당 UA 를 전면 429 로 막았으나(색인 포기), 지금은 속도만
    # 제한한다. 색인은 계속되고 서버는 10초에 1건씩만 받는다.
    #
    # burst=2 nodelay: 연속 2건까지는 즉시 통과시키고 초과분만 429. delay 를 쓰지
    # 않는 이유는 대기시킨 요청이 결국 앱 워커를 잡기 때문이다 — 여기서 원하는 건
    # '천천히 처리'가 아니라 '초과분은 거절'이다.
    #
    # 적용 범위는 교체 이전 규칙과 같게 /apartments/ 로 한정한다. 봇은 /area 도
    # 훑지만(오늘 297건) 워커를 60초씩 물고 늘어진 건 상세 렌더뿐이었다. 재발하면
    # 이 limit_req 를 server 블록으로 올려 사이트 전체에 걸면 된다 — 키가 봇일 때만
    # 채워지므로 그래도 일반 사용자엔 영향이 없다.
    location ^~ /apartments/ {
        limit_req zone=claudebot burst=2 nodelay;
        limit_req_status 429;

        # 429 에만 붙는다(값이 빈 문자열이면 nginx 가 헤더를 생략). always 는 4xx 에도
        # 헤더가 나가도록 하는 것이지 '항상 붙인다'는 뜻이 아니므로 그대로 둔다.
        # 파일 상단 map 주석 참고 — 200 에 no-store 가 새면 CDN 캐시가 죽는다.
        add_header Retry-After $clustead_ratelimit_retry_after always;
        add_header Cache-Control $clustead_ratelimit_cache_control always;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;

        # 앱 컨테이너가 죽어 있거나(재배포·재시작) 응답이 없을 때, Cloudflare 기본
        # 영문 오류 화면 대신 우리 안내 페이지를 보여준다. nginx 는 호스트에서
        # 돌기 때문에 컨테이너가 내려가도 이 경로는 살아 있다.
        #
        # =503 으로 상태코드를 통일한다. 503(Service Unavailable)은 '일시적'이라는
        # 뜻이라 검색엔진이 색인을 지우지 않고 나중에 다시 크롤한다.
        # proxy_intercept_errors 는 켜지 않는다 — 앱이 스스로 낸 5xx(코드 버그)까지
        # 가리면 장애를 못 보게 된다. 여기서 잡는 건 nginx 가 판단한
        # '업스트림 없음/타임아웃'뿐이다.
        error_page 502 503 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/clustead;
        internal;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/clustead.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clustead.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.clustead.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = clustead.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name clustead.com www.clustead.com;
    return 404; # managed by Certbot
}
