{# PWA(홈화면 설치) 공통 헤드. 공개 페이지 템플릿에서 모두 include 한다.
   manifest/sw 는 스코프 문제로 static 이 아니라 루트 경로(app.py 라우트)로 서빙한다. #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#15243B">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
{# iOS 홈화면 실행 시 주소창 없는 전체화면 + 상태바 스타일 #}
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clustead">
<meta name="mobile-web-app-capable" content="yes">
{# ?v= 는 서비스워커의 /static/* cache-first 를 뚫는 유일한 수단이다.
   pwa.js/pwa.css 를 고치면 반드시 함께 올릴 것(안 올리면 기존 방문자는 옛 파일 유지). #}
<link rel="stylesheet" href="{{ url_for('static', filename='pwa.css') }}?v=4">
<script src="{{ url_for('static', filename='pwa.js') }}?v=4" defer></script>
