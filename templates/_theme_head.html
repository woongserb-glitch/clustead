{# 전 페이지 공통 테마 초기값(<head> 맨 앞, 첫 그리기 전에 실행). 저장된 선택이 있으면 그것,
   없으면 PC(761px 이상)는 라이트, 폰은 기기 설정. 예전 홈 전용 키(clustead-billboard-theme)도 읽는다. #}
<script>try { var t = localStorage.getItem('clustead-theme') || localStorage.getItem('clustead-billboard-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else if (window.matchMedia('(min-width: 761px)').matches) document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
