<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 — Clustead</title>
    <meta name="theme-color" content="#15243B">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- 서비스워커가 오프라인일 때 직접 서빙하는 페이지라, 외부 CSS/폰트에
         의존하면 안 된다(네트워크가 없으니 못 받는다). 스타일을 인라인으로 둔다. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
            background: #f7f8fb;
            color: #111;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            max-width: 380px;
            text-align: center;
        }

        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            display: block;
            color: #15243B;
        }

        h1 {
            font-size: 20px;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #5b6472;
            margin-bottom: 24px;
        }

        button {
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #15243B;
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            min-height: 44px;
            cursor: pointer;
        }

        button:active { opacity: 0.85; }
    </style>
</head>

<body>
    <div class="card">
        <svg class="mark" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
            <polygon points="50,9 85.5,29.5 65,49.5 57,36.8" transform="rotate(0 50 50)" />
            <polygon points="50,9 85.5,29.5 65,49.5 57,36.8" transform="rotate(60 50 50)" opacity="0.38" />
            <polygon points="50,9 85.5,29.5 65,49.5 57,36.8" transform="rotate(120 50 50)" />
            <polygon points="50,9 85.5,29.5 65,49.5 57,36.8" transform="rotate(180 50 50)" />
            <polygon points="50,9 85.5,29.5 65,49.5 57,36.8" transform="rotate(240 50 50)" />
            <polygon points="50,9 85.5,29.5 65,49.5 57,36.8" transform="rotate(300 50 50)" />
        </svg>
        <h1>연결이 끊겼습니다</h1>
        <p>인터넷에 연결되어 있지 않아 최신 단지 정보를 불러올 수 없습니다.<br>연결을 확인한 뒤 다시 시도해 주세요.</p>
        <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
</body>

</html>
